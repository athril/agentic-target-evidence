# Landmark trials the clinical-trial retrieval should find, per gene × disease.
# Used by scripts/eval_trial_recall.py (live ClinicalTrials.gov + Open Targets).
# Every NCT id was checked against the registry on 2026-10-11. Pairs span disease
# classes and include ones never used while developing the retrieval rules
# (GLP1R, SLC5A2, IL23A, CETP, EGFR); a landmark may be registered under a broader
# condition than the run's disease (FOURIER: "Dyslipidemia").
