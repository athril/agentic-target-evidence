  # ------------------------------------------------------------ phenotype_omission
  - {id: omission-01, family: phenotype_omission, facts: lrrk2_pd, expect: fire, rule: grounding.phenotype_omission, source: results/report/LRRK2/…/safety.md,
     text: "LRRK2 is a well-established genetic risk factor for Parkinson disease with multiple strong genetic association studies and functional evidence linking it to the pathogenesis of the disease. The gene has a relatively LoF-tolerant constraint profile (LOEUF=0.754), which supports the safety of pharmacological inhibition. Mouse KO phenotypes include cardiovascular, nervous system, and kidney inflammation, but no severe embryonic or postnatal lethality was observed, indicating that chronic inhibition may be feasible. The bulk expression in the substantia nigra is low (3.33 TPM) but not absent, supporting tissue specificity for Parkinson disease. Overall, the data suggest a favorable safety profile with appropriate tissue expression."}
  - {id: omission-02, family: phenotype_omission, facts: lrrk2_pd, expect: no_fire, source: synthetic,
     text: "Knockout mice show kidney phenotypes (giant lysosomes in renal tubule cells, small and atrophic kidneys) and abnormal type II pneumocyte morphology in the lung, both candidate on-target liabilities of chronic LRRK2 inhibition, alongside a modest increase in diastolic blood pressure. Human loss-of-function carriers do not show these effects, and the lung changes in non-human primates treated with inhibitors were reversible. LRRK2 is LoF-tolerant (LOEUF 0.754). Expression is highest in lung and whole blood, so on-target effects outside the brain should be monitored in clinical development."}
  - {id: omission-03, family: phenotype_omission, facts: lrrk2_pd, expect: no_fire, source: synthetic,
     note: "short summary field — omissions are judged on the narrative only",
     text: "Mouse KO phenotypes include kidney effects."}

