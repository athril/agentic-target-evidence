# Labelled corpus for the lens-output guards (services/evidence/guard_rules.py).
#
# Each entry is one sentence, the guard family that must judge it, the fact sheet it
# is judged against, and the human label — `expect: fire` (the sentence contradicts or
# overstates the facts) or `expect: no_fire` (compliant). Labels are written from the
# facts, never from what the guard currently outputs. Optional `rule`/`kind` pin which
# check must fire. `xfail: <reason>` records a known limitation honestly instead of
# deleting the case; it is a strict xfail, so fixing the guard forces the label update.
#
# Sources:
#   results*/…        — sentences harvested from historical runs with
#                       `scripts/guard_flag_inventory.py results*/ --candidates`
#   docs/examples/…   — the published example dossier
#   synthetic         — contrast cases from other gene/disease classes (haploinsufficient
#                       gene, oncology dependency, non-Mendelian complex disease) so the
#                       corpus does not tune every guard to TRPC6 × FSGS
#
# Add a case whenever a guard false positive/negative is found in a report.

