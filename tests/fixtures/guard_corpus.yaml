# Labelled corpus for the lens-output guards (services/evidence/guard_rules.py).
#
# Each entry is one sentence, the guard family that must judge it, the fact sheet it
# is judged against, and the human label — `expect: fire` (the sentence contradicts or
# overstates the facts) or `expect: no_fire` (compliant). Labels are written from the
# facts, never from what the guard currently outputs. Optional `rule`/`kind` pin which
# check must fire. `xfail: <reason>` records a known limitation honestly instead of
# deleting the case; it is a strict xfail, so fixing the guard forces the label update.
#
# Sources:
#   results*/…        — sentences harvested from historical runs with
#                       `scripts/guard_flag_inventory.py results*/ --candidates`
#   docs/examples/…   — the published example dossier
#   synthetic         — contrast cases from other gene/disease classes (haploinsufficient
#                       gene, oncology dependency, non-Mendelian complex disease) so the
#                       corpus does not tune every guard to TRPC6 × FSGS
#
# Add a case whenever a guard false positive/negative is found in a report.

facts:
  trpc6_fsgs:
    gene: TRPC6
    disease: FSGS
    constraint: {loeuf: 0.759, pli: 0.0, mis_z: 1.70, moeuf: 0.928}
    mendelian_grade: true
    known_drugs_count: 0
    approved_count: 0
    indication_approved_drug_count: 1
    indication_active_trial_count: 38
    top_tissues: [Lung, Esophagus_Muscularis, Thyroid]
    disease_relevant_tissues: [Kidney_Cortex]
    project_score: {num_fitness_lines: 2, total_lines: 512, bf_scaled_mean: 3.485}
    trials:
      - {nct_id: NCT05213624, phase: PHASE2, status: COMPLETED}
      - {nct_id: NCT07220083, phase: PHASE3, status: RECRUITING}
    is_oncology: false
  pnpla3_masld:
    gene: PNPLA3
    disease: MASLD
    constraint: {loeuf: 1.261, pli: 0.0, mis_z: -0.44}
    mendelian_grade: false
  scn1a_dravet:  # synthetic: haploinsufficient, missense-constrained Mendelian gene
    gene: SCN1A
    disease: Dravet syndrome
    constraint: {loeuf: 0.12, pli: 1.0, mis_z: 5.5, moeuf: 0.45}
    mendelian_grade: true
  kras_nsclc:  # synthetic: oncology target with broad cell-line dependency
    gene: KRAS
    disease: non-small cell lung cancer
    depmap: {num_dependent_lines: 820, total_lines: 1100, gene_effect_mean: -1.1}
    trials:
      - {nct_id: NCT90000001, phase: PHASE3, status: RECRUITING}
      - {nct_id: NCT90000002, phase: PHASE3, status: ACTIVE_NOT_RECRUITING}
      - {nct_id: NCT90000003, phase: PHASE3, status: COMPLETED}
    is_oncology: true
  complex_t2d:  # synthetic: common complex disease, no Mendelian-grade evidence
    gene: GENEX
    disease: type 2 diabetes
    mendelian_grade: false

