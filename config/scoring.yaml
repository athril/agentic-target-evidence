# Deterministic post-LLM score floors for the experiment/synthesis stage.
#
# Genetics-lens sharpening: a target with Mendelian-grade genetic
# causality (gold-star P/LP support, and/or a ClinGen Definitive/Strong
# classification, and/or strong knowledge-graph corroboration) cannot score
# below this floor. Clinical/safety uncertainty caps the upside, not the
# genetics-driven floor. See src/services/decision/suitability.py.
mendelian_causality_score_floor: 70

# Deterministic suitability score (services/decision/suitability.compute_suitability):
#   score = 50 + 50 × Σ(weight × sign × confidence) / Σ weight − liability penalty
# sign: support +1, oppose −1, neutral / insufficient / missing 0 (pulls toward 50).
lens_weights:
  genetics: 0.25
  clinical: 0.20
  safety: 0.20
  biology: 0.15
  regulatory: 0.10
  commercial: 0.10

# Points subtracted per candidate on-target liability (services/evidence/liabilities.py),
# capped, and multiplied by human_exposure_factor when drugs acting on the target have
# human clinical exposure (an approved drug or a completed phase 3/4 trial). The safety
# lens has already weighed the liabilities: when it gives a status per liability, only
# those it left unresolved or confirmed in humans count, and none when a same-direction
# drug is approved in the indication (its label is the accepted risk). Without statuses
# (the single-call safety lens) every candidate counts.
liability_points:
  high: 4.0
  medium: 1.5
  low: 0.0
liability_penalty_cap: 15
human_exposure_factor: 0.5

# Therapeutic-hypothesis precedent (services/evidence/drug_precedent.py): what drugs acting
# on the target did in this indication, compared with the requested direction. Applied
# after the liability penalty and the Mendelian floor. The lens verdicts read gene and
# disease evidence that is the same for opposite directions, so the clinic's verdict on
# the (gene, disease, direction) triple bounds the score:
#   validated — a same-direction drug is approved here            → score at least min
#   opposed   — opposite-direction drugs approved / phase 3 here  → score at most max
#   failed    — same-direction trials here stopped for efficacy or safety, none approved
#   stalled   — same-direction phase 3 here ended without approval, none still running:
#               late-stage attrition, so at most INVESTIGATE FURTHER
precedent_gates:
  validated: {min: 75}
  opposed: {max: 30}
  failed: {max: 44}
  stalled: {max: 59}

# Programme outcomes (services/evidence/programme_outcomes.py): how strongly the failed
# programmes against the target falsify its *mechanism*. The precedent gates above treat
# any same-direction trial stopped for cause as one failure; here each distinct molecule is
# classified (approved, ongoing, failed for efficacy / safety, discontinued for business
# reasons, stalled without a reason, positive but unfiled) and weighted by the phase it
# reached and by whether it showed target engagement:
#
#   strength = noisy_or(weight(programme) × engagement_factor(programme), over failed and
#                       stalled programmes, one per molecule)
#              × (1 − noisy_or(relief, one per positive-but-unfiled phase 3 programme))
#
# When the experiment stage supplies a strength, the gates below replace the `failed` and
# `stalled` precedent gates; `validated`, `opposed` and the direction gate are unchanged.
programme_outcomes:
  # One molecule's contribution before engagement. A phase 3 efficacy failure falsifies
  # more than a phase 2 one (larger, longer, better powered); a safety stop says less
  # about the mechanism because the harm can be molecule-specific; a phase 3 that ended
  # with no recorded result or reason says little on its own. 0.3 is calibrated so that one
  # such programme does not bound the score (0.18) and two do (0.33, cap 59): the registry
  # gives no reason for most old stops (a torcetrapib phase 3 stopped for excess deaths
  # reads "completed", no reason), and two molecules reaching phase 3 without approval is a
  # pattern, one is an anecdote.
  weights:
    failed_efficacy: {phase3: 0.5, phase2: 0.3, phase1: 0.1}
    # Met a surrogate primary, failed the endpoint that matters (survival, major adverse
    # events) or had excess deaths: an efficacy failure on the decisive endpoint, so it
    # weighs as one. The met surrogate shows the drug was active, not that it engaged the
    # target, so it goes through the engagement question like any efficacy failure.
    failed_hard_endpoint: {phase3: 0.5, phase2: 0.3}
    failed_safety: {phase3: 0.35, phase2: 0.25, phase1: 0.1}
    stalled_unexplained: {phase3: 0.3}
  # A drug that did not change a pharmacodynamic marker of the target in patients failed
  # for a pharmacological reason, not because the mechanism is wrong. Whether it did is
  # not in the registry, so an unanswered question counts as 0.6; safety failures always
  # use 0.6 because on-target and off-target harm cannot be told apart from the registry.
  engagement_factor: {shown: 1.0, not_reported: 0.6, not_assessed: 0.6, not_shown: 0.3}
  # A phase 3 that met its primary endpoint without approval (a sponsor decision, not a
  # failure of the mechanism) offsets the failures by this much each.
  positive_unfiled_relief: 0.3
  # An approval in the indication of a molecule with the requested effect: the mechanism
  # works there, so the other molecules' failures do not falsify it.
  approved_relief: 1.0
  # Highest matching min_strength wins; the score is capped at `max`.
  gates:
    - {min_strength: 0.6, max: 44, reason: "the mechanism failed in several programmes"}
    - {min_strength: 0.3, max: 59, reason: "programmes against the target stalled or failed"}

# Direction-of-effect gate (services/evidence/direction_of_effect.py): when the evidence
# on which way of changing the target helps — approved drugs, labelled worsening of the
# disease, the Mendelian mechanism, human-genetics claims — contradicts the requested
# direction with at least `min_against` strength, the score is capped like an opposed
# precedent. It covers what `opposed` cannot see: a target with no drug in the
# indication, or a drug whose label warns it worsens the disease.
direction_gate: {max: 30, min_against: 0.5}

# Recommendation band by final score (highest matching min wins).
bands:
  - {min: 75, label: "PROCEED"}
  - {min: 60, label: "PROCEED WITH CAUTION"}
  - {min: 45, label: "INVESTIGATE FURTHER"}
  - {min: 0, label: "DEPRIORITISE"}
