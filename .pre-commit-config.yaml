# `pre-commit install` installs both hook types below, so commit messages are
# linted locally with the same .commitlintrc.json the PR check uses.
default_install_hook_types: [pre-commit, commit-msg]
# Hooks without an explicit `stages` run only before the commit, never on the message.
default_stages: [pre-commit]

repos:
  # ruff and mypy run through `uv run`, so they use the exact versions pinned in uv.lock
  # and the same commands as the CI quality job; pinned hook mirrors drifted from both.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      # Whole-package check like CI (`mypy src/`), not per-file; tests/ isn't type-checked.
      - id: mypy
        name: mypy
        entry: uv run mypy src/
        language: system
        files: ^src/.*\.py$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@^21"]
